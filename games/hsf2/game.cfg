# Hyper Street Fighter II: The Anniversary Edition (Capcom 2004, CPS-2 arcade board): per-game
# settings read by the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Hyper Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Hyper Street Fighter II Recomp
id = hsf2
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.hsf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `hsf2` is MAME's parent set (USA 040202); its clones (hsf2a, hsf2j, hsf2j1, hsf2j2) are built from it.
rom_set = hsf2
rom_parent = hsf2
rom_name = Hyper Street Fighter II: The Anniversary Edition (USA 040202)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side by
# side per row (64-bit words); hs2.13m/15m/17m/19m are the QSound-era graphics, and the region is
# populated from 0 (no leading hole, unlike Street Fighter Alpha). sound_program: the Z80's ROMs.
# samples: the QSound chip's (hs2.11m, 8 MiB). key: the board's cipher key.
program = hs2u.03:b308151e hs2u.04:327aa49c hs2.05:dde34a35 hs2.06:f4e56dda hs2.07:ee4420fc hs2.08:c9441533 hs2.09:3fc638a8 hs2.10:20d0f9e4
graphics = hs2.13m:a6ecab17 hs2.15m:10a0ae4d hs2.17m:adfa7726 hs2.19m:bb3ae322
sound_program = hs2.01:c1a13786 hs2.02:2d8794aa
samples = hs2.11m:0e15c359
key = hsf2.key:fc9b18c9

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
